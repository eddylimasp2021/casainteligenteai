# ==============================================================================
# Casa Inteligente I.A. — HomePulse AI
# Configuração Profissional do go2rtc (Gateway de Mídia para Câmeras IP / CFTV)
# ==============================================================================

# 1. API Web, WebSocket e REST
api:
  listen: ":1984"
  origin: "*"
  base_path: ""

# 2. Servidor RTSP local para retransmissão
rtsp:
  listen: ":8554"

# 3. Servidor WebRTC para streaming de baixíssima latência (sub-100ms)
webrtc:
  listen: ":8555"
  candidates:
    - 127.0.0.1:8555
    - 192.168.0.117:8555
    - stun:8555
  ice_servers:
    - urls:
        - "stun:stun.l.google.com:19302"
        - "stun:stun1.l.google.com:19302"

# 4. Transcoder FFmpeg com baixa latência e baseline para navegadores
ffmpeg:
  bin: "D:\\DEV-Apps\\casainteligenteai\\iot-gateway\\deploy\\bin\\ffmpeg.exe"
  h264: "-c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -level 3.0 -pix_fmt yuv420p -g 15"

# 5. Configuração de Streams (Câmeras IP Registradas)
streams:
  # Câmera Garagem Rua (Stream Original RTSP)
  garagem_rua:
    - rtsp://admin:ambar786!@192.168.0.139:554/onvif1

  # Câmera 192.168.0.198 (Stream Original RTSP)
  cam_192_168_0_198:
    - rtsp://admin:ambar786@192.168.0.198:554/onvif1

  # Câmera 192.168.0.240 (Câmera Tripla Multi-Lente 3 em 1 - 1920x3240 Full HD)
  cam_192_168_0_240:
    - rtsp://admin:ambar786@@192.168.0.240:554/onvif1

  # Câmera 192.168.0.149 (Yoosee RTSP Direto)
  cam_192_168_0_149:
    - rtsp://admin:ambar786!@192.168.0.149:554/onvif2
    - rtsp://admin:ambar786!@192.168.0.149:554/onvif1
  replay_stream:
    - ffmpeg:D:\Gravacoes_CFTV\Camera_Tripla_240\Camera_Tripla_240_2026-11-13_11-24-00.mp4#video=h264
  hls_vod_test:
    - ffmpeg:D:\Gravacoes_CFTV\Camera_Tripla_240\Camera_Tripla_240_2026-11-13_11-24-00.mp4#video=h264

# 6. Configuração de Logs com Rotação
log:
  level: "info"
  format: "text"
