services:
  # -------------------------------------------------------------------
  # 1. Broker MQTT (Eclipse Mosquitto com Autenticação e ACLs)
  # -------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: ci-mosquitto
    restart: always
    ports:
      # Expor porta 1883 apenas na rede local; NÃO expor abertamente na internet
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto.acl:/mosquitto/config/mosquitto.acl:ro
      - ./mosquitto.passwd:/mosquitto/config/mosquitto.passwd:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-u", "${MQTT_USERNAME:-casa-gateway-user}", "-P", "${MQTT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ci-iot-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------------
  # 2. Casa Inteligente IoT Gateway (Node.js LTS + TypeScript + Fastify)
  # -------------------------------------------------------------------
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ci-iot-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      - GATEWAY_ID=${GATEWAY_ID:-gw-local-001}
      - GATEWAY_NAME=${GATEWAY_NAME:-Gateway Principal}
      - GATEWAY_API_TOKEN=${GATEWAY_API_TOKEN:-substitua-por-um-token-seguro}
      - MQTT_URL=mqtt://mosquitto:1883
      - MQTT_USERNAME=${MQTT_USERNAME:-casa-gateway-user}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-secret}
      - MQTT_CLIENT_ID=ci-gateway-core
      - HOME_ASSISTANT_URL=${HOME_ASSISTANT_URL:-}
      - HOME_ASSISTANT_TOKEN=${HOME_ASSISTANT_TOKEN:-}
      - ZIGBEE2MQTT_BASE_TOPIC=${ZIGBEE2MQTT_BASE_TOPIC:-zigbee2mqtt}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ci-iot-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # -------------------------------------------------------------------
  # 3. Gateway de Mídia de CFTV (go2rtc: RTSP -> WebRTC / HLS / MSE)
  # -------------------------------------------------------------------
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: ci-go2rtc
    restart: always
    ports:
      - "1984:1984"       # API REST, WebSockets e Interface Web
      - "8554:8554"       # Servidor RTSP local
      - "8555:8555/tcp"   # WebRTC TCP
      - "8555:8555/udp"   # WebRTC UDP
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:rw
      - "D:/Gravacoes_CFTV:/recordings:rw"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1984/api || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ci-iot-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # -------------------------------------------------------------------
  # 4. Gravador Contínuo NVR, API de Busca e Servidor de Vídeo (Disco D:)
  # -------------------------------------------------------------------
  recorder:
    image: alexxit/go2rtc:latest
    container_name: ci-recorder
    restart: always
    command: python3 /config/cftv_recorder.py
    environment:
      - GO2RTC_HOST=ci-go2rtc
      - GO2RTC_PORT=1984
      - RECORDINGS_DIR=/recordings
      - SEGMENT_SECONDS=900
    volumes:
      - ./cftv_recorder.py:/config/cftv_recorder.py:ro
      - "D:/Gravacoes_CFTV:/recordings:rw"
    ports:
      - "1985:1985"
    depends_on:
      go2rtc:
        condition: service_healthy
    networks:
      - ci-iot-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # -------------------------------------------------------------------
  # 5. Túnel HTTPS Fixo Permanente Cloudflare Zero Trust (casainteligenteai)
  # Roteia tanto streaming ao vivo quanto gravações sob URL definitiva
  # -------------------------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ci-tunnel
    restart: always
    command: tunnel --no-autoupdate run --token eyJhIjoiMzJjY2VjY2RiYjRhMmJkYjhkN2E4MjYyMTA0OTAzMzUiLCJ0IjoiNjhjNjc2MTMtNzJhNC00NWYwLTllOGEtNzUwMDg1ZGYyNzZjIiwicyI6Ik5tRTNaV0ZtTVdRdFpUYzVaaTAwWTJKaUxUZzJaamt0WkRnM05qazVPVEZrWW1ObSJ9
    depends_on:
      - recorder
    networks:
      - ci-iot-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # -------------------------------------------------------------------
  # 6. Motor de Reconhecimento Facial I.A. (Face ID Local 24/7)
  # -------------------------------------------------------------------
  face-ai:
    build:
      context: ./face-ai
      dockerfile: Dockerfile
    container_name: ci-face-ai
    restart: always
    environment:
      - PORT=5000
      - GO2RTC_HOST=ci-go2rtc
      - GO2RTC_PORT=1984
      - RECORDINGS_DIR=/recordings
    volumes:
      - "D:/Gravacoes_CFTV:/recordings:rw"
      - ./face-ai/main.py:/app/main.py:ro
    ports:
      - "5000:5000"
    depends_on:
      go2rtc:
        condition: service_healthy
    networks:
      - ci-iot-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mosquitto-data:
  mosquitto-log:

networks:
  ci-iot-net:
    driver: bridge
