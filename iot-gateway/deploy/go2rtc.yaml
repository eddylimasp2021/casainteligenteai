# ==============================================================================
# Casa Inteligente I.A. — HomePulse AI
# Configuração Profissional do go2rtc (Gateway de Mídia para Câmeras IP / CFTV)
# ==============================================================================

# 1. API Web, WebSocket e REST
api:
  listen: ":1984"
  # Habilita CORS irrestrito para permitir conexões do Lovable (https://casainteligenteai.lovable.app)
  origin: "*"
  base_path: ""

# 2. Servidor RTSP local para retransmissão
rtsp:
  listen: ":8554"

# 3. Servidor WebRTC para streaming de baixíssima latência (sub-100ms)
webrtc:
  listen: ":8555"
  # Candidatos ICE para Docker no Windows: expor localhost e IP de LAN da máquina host
  candidates:
    - 127.0.0.1:8555
    - 192.168.0.117:8555
    - stun:8555
  # STUN servers para travessia NAT se necessário
  ice_servers:
    - urls:
        - "stun:stun.l.google.com:19302"
        - "stun:stun1.l.google.com:19302"

# 4. Transcoder FFmpeg com baixa latência e baseline para navegadores
ffmpeg:
  bin: "ffmpeg"
  h264: "-c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -level 3.0 -pix_fmt yuv420p -g 15"

# 5. Configuração de Streams (Câmeras IP Registradas)
# Os fluxos podem ser definidos estaticamente aqui ou dinamicamente via API REST:
# PUT http://localhost:1984/api/streams?name=garagem_rua&src=rtsp://admin:senha@192.168.0.139:554/onvif1
streams:
  # Câmera Garagem Rua (Stream Original RTSP H.265 da Câmera com Backchannel de Áudio Bidirecional)
  garagem_rua:
    - rtsp://admin:ambar786@192.168.0.139:554/onvif1
    - rtsp://admin:ambar786@192.168.0.139:554/onvif1#backchannel=1

  # Câmera Garagem Rua H.264 (Transcodificado com Áudio para WebRTC em navegadores Chrome/Edge + Áudio de Retorno Interfone)
  garagem_rua_h264:
    - ffmpeg:rtsp://127.0.0.1:8554/garagem_rua#video=h264#audio=copy
    - rtsp://admin:ambar786@192.168.0.139:554/onvif1#backchannel=1

  # Câmera 192.168.0.198 (Áudio Bidirecional / Interfone)
  cam_192_168_0_198:
    - rtsp://admin:ambar786@192.168.0.198:554/onvif1
    - rtsp://admin:ambar786@192.168.0.198:554/onvif1#backchannel=1

  # Câmera 192.168.0.240 (Áudio Bidirecional / Interfone)
  cam_192_168_0_240:
    - rtsp://admin:ambar786@192.168.0.240:554/onvif1
    - rtsp://admin:ambar786@192.168.0.240:554/onvif1#backchannel=1

# 5. Configuração de Logs com Rotação
log:
  level: "info"
  format: "text"
