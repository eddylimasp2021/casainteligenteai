# =====================================================================
# CASA INTELIGENTE I.A. — Configuração do Broker Eclipse Mosquitto
# =====================================================================

# Listener MQTT padrão (rede local confiável / interna do Docker)
listener 1883 0.0.0.0
protocol mqtt

# Segurança estrita: NUNCA permitir conexões anônimas em produção
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd
acl_file /mosquitto/config/mosquitto.acl

# Persistência de mensagens e sessões
persistence true
persistence_location /mosquitto/data/

# Logs estruturados
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Configurações de performance e proteção contra DoS
max_connections 1024
max_queued_messages 1000
max_packet_size 65536
