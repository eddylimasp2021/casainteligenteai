# ==============================================================================
# Casa Inteligente I.A. — HomePulse AI
# Configuração Profissional do go2rtc (Gateway de Mídia para Câmeras IP / CFTV)
# ==============================================================================

# 1. API Web, WebSocket e REST
api:
  listen: ":1984"
  origin: "*"
  base_path: ""

# 2. Servidor RTSP local para retransmissão (Conexão única física por câmera)
rtsp:
  listen: ":8554"

# 3. Servidor WebRTC para streaming de baixíssima latência (sub-100ms)
webrtc:
  listen: ":8555"
  candidates:
    - 127.0.0.1:8555
    - 192.168.0.117:8555
    - stun:8555
  ice_servers:
    - urls:
        - "stun:stun.l.google.com:19302"
        - "stun:stun1.l.google.com:19302"

# 4. Transcoder FFmpeg com baixa latência e baseline para navegadores
ffmpeg:
  bin: "D:\\DEV-Apps\\casainteligenteai\\iot-gateway\\deploy\\bin\\ffmpeg.exe"
  h264: "-c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -level 4.0 -pix_fmt yuv420p -g 15 -crf 27 -maxrate 2200k -bufsize 2200k"

# 5. Configuração de Streams (Câmeras IP Registradas)
streams:
  # Câmera Garagem Rua (192.168.0.139 - HEVC Original + H.264 WebRTC)
  garagem_rua:
    - rtsp://admin:ambar786!@192.168.0.139:554/onvif1
  garagem_rua_h264:
    - ffmpeg:rtsp://127.0.0.1:8554/garagem_rua#video=h264#audio=copy

  # Câmera Externa 198 (192.168.0.198 - H.264 Nativa + Fallback H.264)
  cam_192_168_0_198:
    - rtsp://admin:ambar786@192.168.0.198:554/onvif1
  cam_192_168_0_198_h264:
    - ffmpeg:rtsp://127.0.0.1:8554/cam_192_168_0_198#video=h264#audio=copy

  # Câmera Tripla Multi-Lente 3 em 1 (192.168.0.240 - HEVC 1920x3240 + H.264 960x1620 Level 4.0 @ 1.4 Mbps p/ WebRTC instantâneo)
  cam_192_168_0_240:
    - rtsp://admin:ambar786@@192.168.0.240:554/onvif1
  cam_192_168_0_240_h264:
    - exec:D:\DEV-Apps\casainteligenteai\iot-gateway\deploy\bin\ffmpeg.exe -hide_banner -v error -allowed_media_types video+audio -fflags nobuffer -flags low_delay -timeout 5000000 -user_agent go2rtc/ffmpeg -rtsp_flags prefer_tcp -i rtsp://127.0.0.1:8554/cam_192_168_0_240 -vf scale=960:1620 -r 15 -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -level 4.0 -pix_fmt yuv420p -g 15 -b:v 1400k -maxrate 1800k -bufsize 1400k -c:a copy -user_agent ffmpeg/go2rtc -rtsp_transport tcp -f rtsp {output}

  # Câmera Yoosee 149 (192.168.0.149 - RTSP Direto + Fallback H.264)
  cam_192_168_0_149:
    - rtsp://admin:ambar786!@192.168.0.149:554/onvif2
    - rtsp://admin:ambar786!@192.168.0.149:554/onvif1
  cam_192_168_0_149_h264:
    - ffmpeg:rtsp://127.0.0.1:8554/cam_192_168_0_149#video=h264#audio=copy

# 6. Configuração de Logs
log:
  level: "info"
  format: "text"
